[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
background_opacity = 0.0
border_width = 2.0
concave_edge_corners = false
enabled = true
launcher_position = "start"
margin_edge = 10
pinned = [ "zen", "steam", "discord", "spotify" ]
radius = 32
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
